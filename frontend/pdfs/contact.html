<!doctype html><meta charset="utf-8"><style>
body{font:16px Arial;margin:20px;background:#eee}h1{clear:both;padding-top:15px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.item{background:white;padding:8px;text-align:center}.item img{width:100%;height:210px;object-fit:contain}.item b{display:block;margin-top:5px}
</style><div id="root"></div><script>
const root=document.querySelector('#root');
for(const [folder,count] of [['bolos',9],['doces',30]]){
 root.insertAdjacentHTML('beforeend',`<h1>${folder}</h1><div class="grid" id="${folder}"></div>`);
 const grid=document.querySelector(`#${folder}`);
 for(let i=1;i<=count;i++){const n=String(i).padStart(2,'0');grid.insertAdjacentHTML('beforeend',`<div class="item"><img src="${folder}/images/foto-${n}.jpg"><b>${folder} ${n}</b></div>`)}
}
</script>
